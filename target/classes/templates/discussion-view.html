<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${discussion.title}">Discussion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.2/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .message-area { height: 60vh; overflow-y: auto; background: #f8f9fa; padding: 12px; border-radius: 6px; }
        .message { margin-bottom: 10px; }
        .message .meta { font-size: 0.85rem; color: #555; }
    </style>
</head>
<body class="container mt-4">
<a href="/discussions" class="btn btn-link">← Назад</a>
<h1 th:text="${discussion.title}">Title</h1>
<p th:text="${discussion.description}">Description</p>
<div class="mb-3">
    <small>Автор: <span th:text="${discussion.author.username}">author</span>, создано: <span th:text="${#temporals.format(discussion.createdAt, 'yyyy-MM-dd HH:mm')}">date</span></small>
</div>

<div id="messages" class="message-area mb-3">
    <div th:each="m : ${messages}" class="message">
        <div><strong th:text="${m.sender.username}">sender</strong> <span class="meta" th:text="${#temporals.format(m.createdAt, 'HH:mm dd.MM.yyyy')}">time</span></div>
        <div th:text="${m.content}">content</div>
    </div>
</div>

<div class="input-group mb-4">
    <input id="messageInput" class="form-control" placeholder="Написать сообщение...">
    <button id="sendBtn" class="btn btn-primary">Отправить</button>
</div>

<script th:inline="javascript">
    const discussionId = [[${discussion.id}]];
    const username = [[${username != null}]] ? '[[${username}]]' : 'anonymous';

    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function(frame) {
        console.log('WS connected: ' + frame);
        stompClient.subscribe('/topic/discussions/' + discussionId, function(msg) {
            const d = JSON.parse(msg.body);
            appendMessage(d);
        });
    });

    function appendMessage(m) {
        const area = document.getElementById('messages');
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `<div><strong>${m.sender}</strong> <span class="meta">${new Date(m.createdAt).toLocaleString()}</span></div><div>${m.content}</div>`;
        area.appendChild(el);
        area.scrollTop = area.scrollHeight;
    }

    document.getElementById('sendBtn').addEventListener('click', send);
    document.getElementById('messageInput').addEventListener('keypress', function(e){
        if (e.key==='Enter') send();
    });

    function send() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        const payload = { sender: username, content: text };
        stompClient.send('/app/discussions/' + discussionId + '/send', {}, JSON.stringify(payload));
        input.value = '';
    }
</script>
</body>
</html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Discussions</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-4">
    <h1>Список обсуждений</h1>
    <div th:each="discussion : ${discussions}" class="mb-3">
        <h3>
            <a th:href="@{/discussions/{id}(id=${discussion.id})}" th:text="${discussion.title}">Discussion Title</a>
        </h3>
        <p th:text="${discussion.description}">Description</p>
        <small>Автор: <span th:text="${discussion.author.username}">author</span>, создано: <span th:text="${#temporals.format(discussion.createdAt, 'yyyy-MM-dd HH:mm')}">date</span></small>
    </div>
</div>
</body>
</html>
