<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Обсуждения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .discussion-card {
            transition: transform 0.2s;
            border: 1px solid #e9ecef;
            border-radius: 8px;
        }
        .discussion-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .discussion-title {
            color: #0d6efd;
            text-decoration: none;
        }
        .discussion-title:hover {
            color: #0a58ca;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Список обсуждений</h1>
        <span class="text-muted" th:text="'Всего: ' + ${discussions.size()}">Всего: 0</span>
    </div>

    <div th:if="${discussions.empty}" class="alert alert-info">
        Пока нет обсуждений. Будьте первым, кто создаст обсуждение!
    </div>

    <div th:each="discussion : ${discussions}" class="card discussion-card mb-3">
        <div class="card-body">
            <h5 class="card-title">
                <a th:href="@{/discussions/{id}(id=${discussion.id})}"
                   class="discussion-title"
                   th:text="${discussion.title}">Discussion Title</a>
            </h5>
            <p class="card-text text-muted" th:text="${discussion.description}">Description</p>
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">
                    Автор: <strong th:text="${discussion.author.username}">author</strong>,
                    создано: <span th:text="${#temporals.format(discussion.createdAt, 'dd.MM.yyyy HH:mm')}">date</span>
                </small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
