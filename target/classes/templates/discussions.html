<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Парилка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        header {
            background-color: #0d6efd;
            color: white;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .discussion-card {
            transition: transform 0.2s;
            border: 1px solid #e9ecef;
            border-radius: 8px;
        }
        .discussion-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .discussion-title {
            color: #0d6efd;
            text-decoration: none;
        }
        .discussion-title:hover {
            color: #0a58ca;
        }
        .search-input {
            border-radius: 20px;
            padding: 0.5rem 1rem;
        }
        .pagination .page-item.active .page-link {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .pagination .page-link {
            color: #0d6efd;
        }
    </style>
</head>
<body>
<header>
    <div class="header-container">
        <div>
            <h1 class="h3 mb-0">Парилка</h1>
            <p class="mb-0 small">Дай волю своим мыслям</p>
        </div>
        <form th:action="@{/logout}" method="post" class="mb-0">
            <button type="submit" class="btn btn-light btn-sm">Выйти</button>
        </form>
    </div>
</header>

<div class="container">
    <form class="d-flex justify-content-center mb-4" th:action="@{/discussions}" method="get">
        <input class="form-control me-2 w-50 search-input"
               type="search"
               name="q"
               placeholder="Поиск обсуждений..."
               th:value="${param.q}">
        <button class="btn btn-outline-primary" type="submit">Найти</button>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4">Список обсуждений</h2>
        <span class="text-muted" th:text="'Всего: ' + ${discussions.size()}">Всего: 0</span>
    </div>

    <div th:if="${discussions.empty}" class="alert alert-info">
        Пока нет обсуждений. Будьте первым, кто создаст обсуждение!
    </div>

    <article th:each="discussion : ${discussions}"
             class="card discussion-card mb-3"
             itemscope
             itemtype="https://schema.org/DiscussionForumPosting">
        <div class="card-body">
            <h5 class="card-title">
                <a th:href="@{/discussions/{id}(id=${discussion.id})}"
                   class="discussion-title"
                   th:text="${discussion.title}">Discussion Title</a>
            </h5>
            <p class="card-text text-muted" th:text="${discussion.description}">Description</p>
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">
                    Автор: <strong th:text="${discussion.author.username}">author</strong>,
                    создано: <span th:text="${#temporals.format(discussion.createdAt, 'dd.MM.yyyy HH:mm')}">date</span>
                </small>
            </div>
        </div>
    </article>

    <hr class="my-4">

    <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4 mb-5">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/discussions(page=${currentPage - 1})}">&lt;</a>
            </li>

            <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                class="page-item"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/discussions(page=${i})}" th:text="${i}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/discussions(page=${currentPage + 1})}">&gt;</a>
            </li>
        </ul>
    </nav>

    <div class="text-center mb-3">
        <button class="btn btn-success" type="button" data-bs-toggle="collapse" data-bs-target="#createForm">
            + Новое обсуждение
        </button>
    </div>

    <div class="collapse" id="createForm">
        <div class="card mb-5">
            <div class="card-body">
                <h4 class="card-title mb-3">Создать новое обсуждение</h4>

                <form th:action="@{/discussions/add}" method="post">
                    <div class="mb-3">
                        <label for="title" class="form-label">Название</label>
                        <input type="text" id="title" name="title" class="form-control" placeholder="Введите тему" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Описание</label>
                        <textarea id="description" name="description" class="form-control" rows="3"
                                  placeholder="Теги" required></textarea>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Создать</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
